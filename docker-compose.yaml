services:
  cms:
    build: .
    volumes:
      - ./dockerenv:/src/.venv
      - .:/src
    ports:
      - "8000:8000"
    environment:
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cms
      PYTHONPATH: /src
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      # Bootstrap superuser. Used on first boot and for admin tasks only;
      # the application never connects as this role.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cms
      # Consumed by initdb/01-init.sh to create the application role.
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cms"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pg-data:
